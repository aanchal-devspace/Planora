<!DOCTYPE html>
<html>

<head>
    <title>Planora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body onload="loadDash()">
<h1>Travel Dashboard</h1>
<div class="dash">

<div class="box2">
<h2>Trip Summary</h2>
<p><b>Destination :</b> <span id="d1"></span></p>

<p><b>Start :</b> <span id="d2"></span></p>
<p><b>End :</b> <span id="d3"></span></p>
<p><b>Budget :</b> ₹<span id="d4"></span></p>

<p><b>Travellers :</b> <span id="d5"></span></p>

</div>
<div class="box2">

<h2>Trip Status</h2>
<p>Activities Planned : <span id="a1"></span></p>
<p>Packing Items : <span id="a2"></span></p>

<p style="color:rgb(39, 194, 39);font-size:22px;">
Ready To Travel
</p>
</div>
</div>

<div class="msg">
<h2>Have A Safe Journey🎉☺️ Maje karo yr</h2>

<p>
Thank you for using Planora❤️❤️
Enjoy your trip
</p>
<button onclick="again()">
Plan Another Trip
</button>
</div>

<script src="logic.js"></script>
</body>
</html>
